; WPiTV PHP overrides - disesuaikan DEPLOYMENT.md
; Production-like tapi tetap dev-friendly (APP_DEBUG dikontrol via .env)

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
max_input_vars = 3000

; Laravel butuh timezone konsisten
date.timezone = Asia/Jakarta

; Opcache (aktif, tapi validate timestamps on untuk dev via volume)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Session / file upload
session.gc_maxlifetime = 1800

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
