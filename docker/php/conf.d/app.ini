; Production PHP settings. Source code is baked into the image.

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
max_input_vars = 3000

; Laravel butuh timezone konsisten
date.timezone = Asia/Jakarta

; Immutable application image: do not stat source files on each request.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.enable_cli = 1

; Session / file upload
session.gc_maxlifetime = 1800

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
