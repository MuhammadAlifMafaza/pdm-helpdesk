server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Security headers (DEPLOYMENT.md §11, docs/PRODUCTION_CHECKLIST.md)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    # HSTS hanya jika HTTPS (jangan aktif di http://localhost:8082)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Jangan expose .env, storage, dll - DocumentRoot sudah /public tapi defense in depth
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|htaccess|htpasswd)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Livewire routes (e.g. /livewire-xxx/livewire.js, /livewire/update) must hit PHP, not static cache
    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ ^/livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets - cache 1y (Vite build) - exclude livewire pseudo-static paths
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Storage symlink: /storage -> storage/app/public
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
        # Block PHP execution inside storage
        location ~ \.php$ {
            return 403;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb WebSocket endpoint. In production, terminate TLS at this proxy
    # and set VITE_REVERB_HOST/PORT/SCHEME to the public HTTPS origin.
    location ^~ /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_busy_buffers_size 32k;
    }

    # Deny access to hidden files inside public juga
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 20M;
}
