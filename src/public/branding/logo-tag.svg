<svg width="100%" height="100%" viewBox="0 0 950 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            /* ========================================================= */
            /* 1. STATE DEFAULT / LIGHT MODE (TEMA TERANG)               */
            /* ========================================================= */
            .brand-text {
                fill: #004B87;
                transition: fill 0.3s ease;
            }

            .tagline-text {
                fill: #475569;
                transition: fill 0.3s ease;
            }

            .separator-line {
                fill: #CBD5E1;
                transition: fill 0.3s ease;
            }

            .icon-h {
                fill: #004B87;
                transition: fill 0.3s ease;
            }

            .icon-d {
                fill: #FFCA08;
                /* Kuning Sunflower tetap cerah di kedua tema */
            }

            /* ========================================================= */
            /* 2. ADAPTIF DARK MODE (Mendukung Class .dark dari Filament)*/
            /* ========================================================= */
            :root .dark .brand-text,
            .dark .brand-text {
                fill: #60A5FA;
            }

            :root .dark .tagline-text,
            .dark .dark .tagline-text {
                fill: #94A3B8;
            }

            :root .dark .separator-line,
            .dark .dark .separator-line {
                fill: #475569;
            }

            :root .dark .icon-h,
            .dark .dark .icon-h {
                fill: #60A5FA;
            }

            /* Antisipasi jika file di-load sebagai image statis oleh browser */
            @media (prefers-color-scheme: dark) {
                .brand-text {
                    fill: #60A5FA;
                }

                .tagline-text {
                    fill: #94A3B8;
                }

                .separator-line {
                    fill: #475569;
                }

                .icon-h {
                    fill: #60A5FA;
                }
            }
        </style>
    </defs>

