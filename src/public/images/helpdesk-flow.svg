<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="500" rx="24" fill="#F8FAFC"/>
    <rect x="1" y="1" width="1198" height="498" rx="23" stroke="#CBD5E1" stroke-width="2"/>
    <text x="600" y="58" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="26" font-weight="700">Alur Layanan Helpdesk</text>
    <text x="600" y="88" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="15">Siklus layanan internal Institut Widya Pratama</text>

    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0 0L10 5L0 10Z" fill="#2563EB"/>
        </marker>
    </defs>

    <line x1="250" y1="205" x2="350" y2="205" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="550" y1="205" x2="650" y2="205" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="850" y1="205" x2="950" y2="205" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="50" y="145" width="200" height="120" rx="16" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="85" cy="180" r="18" fill="#2563EB"/>
    <text x="85" y="186" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">1</text>
    <text x="150" y="185" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="18" font-weight="700">Pemohon</text>
    <text x="150" y="215" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">Membuat tiket perbaikan</text>
    <text x="150" y="237" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">atau pengajuan barang</text>

    <rect x="350" y="145" width="200" height="120" rx="16" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="385" cy="180" r="18" fill="#0284C7"/>
    <text x="385" y="186" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">2</text>
    <text x="450" y="185" text-anchor="middle" fill="#0C4A6E" font-family="Arial, sans-serif" font-size="18" font-weight="700">Admin</text>
    <text x="450" y="215" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">Memverifikasi</text>
    <text x="450" y="237" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">dan mengelola</text>

    <rect x="650" y="145" width="200" height="120" rx="16" fill="#FEF3C7" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="685" cy="180" r="18" fill="#D97706"/>
    <text x="685" y="186" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">3</text>
    <text x="750" y="185" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="18" font-weight="700">Teknisi</text>
    <text x="750" y="215" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">Menangani layanan</text>
    <text x="750" y="237" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">dan memperbarui status</text>

    <rect x="950" y="145" width="200" height="120" rx="16" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="985" cy="180" r="18" fill="#16A34A"/>
    <text x="985" y="186" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">4</text>
    <text x="1050" y="185" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="18" font-weight="700">Sistem</text>
    <text x="1050" y="215" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">Mencatat timeline,</text>
    <text x="1050" y="237" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="16">audit trail, dan laporan</text>

    <path d="M1050 265V345H150V265" stroke="#64748B" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
    <rect x="330" y="360" width="540" height="78" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="600" y="392" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="20" font-weight="700">Pemohon menerima pembaruan</text>
    <text x="600" y="418" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">Status, komunikasi, dan hasil layanan tersimpan terpusat</text>
