x-podman:
  in_pod: false

services:
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: localhost/helpdesk-php:latest
    restart: unless-stopped
    command: ["sh", "-lc", "chown -R www-data:www-data /var/www/html/storage/framework/views && exec php-fpm"]
    network_mode: pasta
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:${DB_FORWARD_PORT:-33062}:3306"
    env_file:
      - ./src/.env
    environment:
      COMPOSER_PROCESS_TIMEOUT: "0"
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor
      - view_cache_data:/var/www/html/storage/framework/views
    post_start:
      - command: chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
        user: root

  db:
    image: docker.io/library/mysql:8.0
    restart: unless-stopped
    network_mode: service:php
    depends_on:
      php:
        condition: service_started
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-helpdesk_dev}
      MYSQL_USER: ${DB_USERNAME:-helpdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deployment .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deployment .env}
      TZ: Asia/Jakarta
    volumes:
      - helpdesk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  queue:
    image: localhost/helpdesk-php:latest
    restart: unless-stopped
    network_mode: service:php
    env_file:
      - ./src/.env
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy

  reverb:
    image: localhost/helpdesk-php:latest
    restart: unless-stopped
    network_mode: service:php
    env_file:
      - ./src/.env
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy

  nginx:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    network_mode: service:php
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./src/storage/app/public:/var/www/html/storage/app/public:ro
      - vendor_data:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  assets:
    image: docker.io/library/node:22-alpine
    profiles:
      - tools
    network_mode: pasta
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: sh -lc "npm ci && npm run build"

volumes:
  vendor_data:
  node_modules_data:
  view_cache_data:
  helpdesk_mysql_data:
