services:
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: helpdesk-php:latest
    restart: unless-stopped
    env_file:
      - ./src/.env
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk

  db:
    image: docker.io/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-helpdesk_db}
      MYSQL_USER: ${DB_USERNAME:-helpdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in root .env}
      TZ: Asia/Jakarta
    volumes:
      - helpdesk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - helpdesk

  queue:
    image: helpdesk-php:latest
    restart: unless-stopped
    env_file:
      - ./src/.env
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor:ro
    command: ["su-exec", "www-data", "php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk

  reverb:
    image: helpdesk-php:latest
    restart: unless-stopped
    env_file:
      - ./src/.env
    volumes:
      - ./src:/var/www/html
      - vendor_data:/var/www/html/vendor:ro
    command: ["su-exec", "www-data", "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk

  nginx:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_FORWARD_PORT:-8082}:80"
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./src/storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - reverb
    networks:
      - helpdesk

  assets:
    image: docker.io/library/node:22-alpine
    profiles:
      - tools
    working_dir: /var/www/html
    env_file:
      - ./src/.env
    volumes:
      - ./src:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    command: sh -lc "npm ci && npm run build"
    networks:
      - helpdesk

volumes:
  helpdesk_mysql_data:
  vendor_data:
  node_modules_data:

networks:
  helpdesk:
    driver: bridge
